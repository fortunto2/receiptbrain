name: ReceiptBrain
options:
  bundleIdPrefix: co.superduperai
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  SWIFT_VERSION: "6.0"
  DEVELOPMENT_TEAM: "8N495BBBLM"
  CODE_SIGN_STYLE: Manual
  # Named by SHA-1: the profile carries the older iPhone Distribution cert, and
  # by name Xcode picks Apple Distribution and refuses to sign.
  CODE_SIGN_IDENTITY: "8167B3F8652E51FF78636AE13E6BD5D097AB9B54"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  # iPhone only: the layouts were built and checked at phone width.
  TARGETED_DEVICE_FAMILY: "1"

targets:
  ReceiptBrain:
    type: application
    platform: iOS
    sources:
      - path: ReceiptBrain
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.ReceiptBrain
        PROVISIONING_PROFILE_SPECIFIER: ReceiptBrain-Store
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "8167B3F8652E51FF78636AE13E6BD5D097AB9B54"
        DEVELOPMENT_TEAM: "8N495BBBLM"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 3
        INFOPLIST_FILE: ReceiptBrain/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    info:
      path: ReceiptBrain/Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "ReceiptBrain needs camera access to scan receipts"
        NSPhotoLibraryUsageDescription: "ReceiptBrain needs photo library access to import receipt images"
        ITSAppUsesNonExemptEncryption: false

  ReceiptBrainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ReceiptBrainTests
    dependencies:
      - target: ReceiptBrain
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.ReceiptBrainTests
      GENERATE_INFOPLIST_FILE: YES
